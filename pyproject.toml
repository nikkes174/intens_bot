[project]
name = "eat-bot"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.7,<4.0",
    "httpx>=0.27,<1.0",
    "Pillow>=10.0,<13.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
