[project]
name = "telegram-monitor"
version = "0.1.0"
description = "Telegram channel and group monitor with an aiogram admin bot"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "aiogram>=3.1,<4",
    "telethon>=1.34,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.19,<1",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
