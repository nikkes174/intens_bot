[project]
name = "intens_bot"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4.0",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "betterlogging>=1.0",
    "environs>=11.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "SQLAlchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "uvicorn>=0.29",
    "yookassa>=3.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "TCH", "PL", "NPY", "AIR"]
ignore = [
    "DTZ001",  # datetime.now() without timezone
    "DTZ003",  # datetime.utcnow() deprecated
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "SIM108",  # use ternary operator
    "SIM117",  # merge nested with statements
    "AIR001",  # flask-like code
]

[tool.ruff.lint.isort]
# The repository's Alembic migration directory is not the installed alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E501",     # long lines in test signatures with many fixtures
    "PLR0913",  # too many arguments in fixtures
    "PLR0917",  # too many positional arguments
    "PLC0415",  # import not at top-level
    "ARG001",   # unused function argument
    "ARG002",   # unused method argument
    "SLF001",   # private member access
    "PLC2701",  # import private name
]
"alembic/*" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/db/models.py" = [
    "DTZ011",   # date.today() without timezone
]
"tgbot/db/crud_users.py" = [
    "DTZ011",   # date.today() without timezone (legacy module)
]
"tgbot/services/outbox.py" = [
    "PLR0917",  # too many positional arguments
    "PLR0915",  # payment fulfilment coordinates message, files, and channel invites
]
"tgbot/services/scheduled.py" = [
    "PLR0917",  # scheduled-message preparation receives its repositories explicitly
]
"tgbot/handlers/user.py" = [
    "PLR0917",  # too many positional arguments
    "PLC0415",  # import not at top-level
]
"tgbot/handlers/admin.py" = [
    "PLR0917",  # too many positional arguments
    "PLC0415",  # import not at top-level
]
"tgbot/services/payment.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/services/delivery.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/services/access.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/db/repositories/order.py" = [
    "PLR0917",  # too many positional arguments
    "PLC0415",  # import not at top-level
]
"tgbot/db/repositories/training.py" = [
    "PLR0917",  # too many positional arguments
    "PLC0415",  # import not at top-level
]
"tgbot/db/repositories/material.py" = [
    "PLR0917",  # too many positional arguments
    "PLC0415",  # import not at top-level
]
"tgbot/db/repositories/user.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/db/repositories/access.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/db/repositories/delivery.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/db/repositories/outbox.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/db/repositories/invite.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/db/repositories/base.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/db/seed.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/db/db.py" = [
    "PLR0917",  # too many positional arguments
]
"tgbot/config.py" = [
    "PLR0917",  # too many positional arguments
]
"bot.py" = [
    "PLR0917",  # too many positional arguments
    "PLC0415",  # import not at top-level
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
